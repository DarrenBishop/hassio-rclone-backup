---
name: Rclone Backup
version: 3.4.1
slug: rclone_backup
description: Automatically sync backup to remote locations using rclone
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
url: https://github.com/jcwillox/hassio-rclone-backup
homeassistant_api: true
ingress: true
panel_icon: mdi:cloud-sync
map:
  - addons:rw
  - addon_config:rw
  - all_addon_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:ro
options:
  jobs:
    - name: Sync Daily Backups
      schedule: 10 4 * * *
      command: sync
      sources:
        - "/backup"
      destination: google:/Backup/Home Assistant
      include: []
      exclude: []
      flags: {}
  dry_run: true
  config_path: "/homeassistant/rclone.conf"
  remote_control: false
  rc_username: ""
  rc_password: ""
  rc_stats: "10s"
schema:
  jobs:
    - name: str?
      schedule: str?
      command: str
      source: str?
      sources:
        - str?
      destination: str?
      destinations:
        - str?
      include:
        - str?
      exclude:
        - str?
      flags: "match({(('[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))(, *?'[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))*)?})?"
      extra_flags:
        - str?
  dry_run: bool?
  flags: "match({(('[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))(, *?'[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))*)?})?"
  extra_flags:
    - str?
  run_once: bool?
  config_path: str?
  rclone_config: str?
  no_rename: bool?
  no_unrename: bool?
  no_slugify: bool?
  log_level: list(debug|info|warning|error|fatal)?
  remote_control: bool?
  rc_username: str?
  rc_password: password?
  rc_job_expire: str?
  rc_allow_origin: str?
  rc_stats: str?
#image: ghcr.io/jcwillox/hassio-rclone-backup/{arch}
ports:
  5572/tcp: null
ports_description:
  5572/tcp: >-
    Rclone remote-control (rc) API — a dedicated authenticated daemon for
    network clients such as the CloneAssistant integration. The Web UI is
    unaffected (ingress only). Only assign a host port after enabling
    "remote_control" and setting rc_username/rc_password.
devices:
  - /dev/fuse
privileged:
  - SYS_ADMIN
apparmor: false
